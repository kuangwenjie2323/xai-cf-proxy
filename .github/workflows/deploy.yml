name: Deploy Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: xai-cf-proxy-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 暂时固定 Node 20 LTS，规避 Node 22 + npm 组合在 CI 中的偶发兼容问题。
          node-version: 20
          # 固定官方 npm 源，避免 lockfile 被镜像源污染导致安装结果不一致、CI 不稳定。
          registry-url: https://registry.npmjs.org/
          cache: npm

      - name: Install dependencies
        run: |
          # 显式指定官方 npm registry，避免不同镜像返回差异包元数据影响可重复构建。
          npm config set registry https://registry.npmjs.org/
          npm ci --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Validate Worker bundle
        run: npm run check

      - name: Assert Cloudflare secrets are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing secret: CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing secret: CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
